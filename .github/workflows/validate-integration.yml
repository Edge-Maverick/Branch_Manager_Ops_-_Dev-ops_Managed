name: Validate Deployment to Integration
on:
  pull_request:
    branches: [ Integration ]
    paths:
      - 'force-app/**'

jobs:
  validate-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Authenticate Integration Org
        run: |
          echo "${{ secrets.SFDX_INTEGRATION_AUTH_URL }}" > auth_url.txt
          sf org login sfdx-url --sfdx-url-file auth_url.txt --set-default --alias integration

      - name: Validate Metadata (Check-Only)
        run: |
          # --check-only ensures no changes are committed
          # --test-level RunLocalTests ensures logic is validated
          sf project deploy validate \
            --source-dir force-app \
            --test-level RunLocalTests \
            --wait 30
