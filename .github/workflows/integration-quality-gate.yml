name: Integration Quality Gate
on:
  pull_request:
    branches: [ Integration ]
    paths:
      - 'force-app/**'
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for GitHub Security Tab
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node & Salesforce CLI
        run: |
          npm install -g @salesforce/cli@latest
          sf plugins install code-analyzer@latest

      # --- STEP 1: SCAN (Using Standard Salesforce Rules) ---
      - name: Run Code Analyzer (SARIF)
        run: |
          # We use .sarif to feed the GitHub Security Tab
          # --severity-threshold 1 ensures the job fails on Critical errors
          sf code-analyzer run \
            --workspace . \
            --output-file results.sarif \
            --severity-threshold 1

      - name: Upload to Security Tab
        if: always() 
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      # --- STEP 2: ORG VALIDATION ---
      - name: Authenticate Integration Org
        run: |
          echo "${{ secrets.SFDX_INTEGRATION_AUTH_URL }}" > auth_url.txt
          sf org login sfdx-url --sfdx-url-file auth_url.txt --set-default --alias integration
          rm auth_url.txt

      - name: Validate Metadata (Check-Only)
        run: |
          # This simulates the deployment to catch missing dependencies or failing tests
          sf project deploy validate \
            --source-dir force-app \
            --test-level RunLocalTests \
            --wait 30
